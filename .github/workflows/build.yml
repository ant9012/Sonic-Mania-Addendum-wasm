name: Build and Upload Game.wasm

on:
  push:
    branches: [ "stable-wasm" ]
  pull_request:
    branches: [ "stable-wasm" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure CMake
        run: emcmake cmake -B build

      - name: Build Project
        run: cmake --build build

      
      - name: Upload Game.wasm
        uses: actions/upload-artifact@v4
        with:
          name: game-wasm
          # Adjust this path if CMake outputs the file into a sub-directory like build/bin/
          path: build/Addendum.wasm
